services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hartono_event_app
    restart: unless-stopped
    ports:
      - "8088:80"
      - "5174:5174"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hartono_events
      - DB_USERNAME=hartono
      - DB_PASSWORD=secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hartono-network

  mysql:
    image: mysql:8.0
    container_name: hartono_event_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hartono_events
      MYSQL_USER: hartono
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33068:3306"
    volumes:
      - hartono_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hartono", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hartono-network

volumes:
  hartono_db_data:
    driver: local

networks:
  hartono-network:
    driver: bridge
